<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="The scissor lift and where each device sits"><style>.t{fill:#1c2430;font:13px system-ui,sans-serif}.s{fill:#5d6b7c;font:11px system-ui,sans-serif}.b{fill:#eef2f7;stroke:#5d6b7c;stroke-width:1.5}.a{fill:#dbe8fb;stroke:#2563c4;stroke-width:1.5}.l{stroke:#5d6b7c;stroke-width:1.5;fill:none}.g{stroke:#5d6b7c;stroke-width:2;fill:none}.m{stroke:#8794a6;stroke-width:6;stroke-linecap:round;fill:none}.k{stroke:#2563c4;stroke-width:2.5;fill:none}@media (prefers-color-scheme:dark){.t{fill:#e6ebf2}.s{fill:#97a4b5}.b{fill:#1b222b;stroke:#97a4b5}.a{fill:#1d3558;stroke:#6aa3f5}.l,.g{stroke:#97a4b5}.m{stroke:#6d7a8c}.k{stroke:#6aa3f5}}</style>
