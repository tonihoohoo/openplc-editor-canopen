<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="The machine CAN bus with four nodes and the safety relay"><style>.t{fill:#1c2430;font:13px system-ui,sans-serif}.s{fill:#5d6b7c;font:11px system-ui,sans-serif}.b{fill:#eef2f7;stroke:#5d6b7c;stroke-width:1.5}.a{fill:#dbe8fb;stroke:#2563c4;stroke-width:1.5}.r{fill:#fbe3e1;stroke:#c0312b;stroke-width:1.5}.l{stroke:#5d6b7c;stroke-width:2;fill:none}.p{stroke:#c0312b;stroke-width:2;fill:none}.k{stroke:#2563c4;stroke-width:4;fill:none}@media (prefers-color-scheme:dark){.t{fill:#e6ebf2}.s{fill:#97a4b5}.b{fill:#1b222b;stroke:#97a4b5}.a{fill:#1d3558;stroke:#6aa3f5}.r{fill:#4a1f1d;stroke:#ef6b63}.l{stroke:#97a4b5}.p{stroke:#ef6b63}.k{stroke:#6aa3f5}}</style>
<title>The machine CAN bus</title>
<line x1="40" y1="170" x2="720" y2="170" class="k"/>
<text x="40" y="190" class="s">CAN bus, 250 kbit/s, SYNC every 20 ms</text>
<g><rect x="50" y="40" width="150" height="70" rx="8" class="a"/><text x="125" y="68" text-anchor="middle" class="t">Chassis controller</text><text x="125" y="88" text-anchor="middle" class="s">master, node 1</text><line x1="125" y1="110" x2="125" y2="170" class="l"/></g>
<g><rect x="225" y="40" width="150" height="70" rx="8" class="b"/><text x="300" y="68" text-anchor="middle" class="t">Platform control box</text><text x="300" y="88" text-anchor="middle" class="s">slave, node 10 over LSS</text><line x1="300" y1="110" x2="300" y2="170" class="l"/></g>
<g><rect x="400" y="40" width="150" height="70" rx="8" class="b"/><text x="475" y="68" text-anchor="middle" class="t">Valve module</text><text x="475" y="88" text-anchor="middle" class="s">slave, node 20</text><line x1="455" y1="110" x2="455" y2="170" class="l"/></g>
<g><rect x="575" y="40" width="150" height="70" rx="8" class="b"/><text x="650" y="68" text-anchor="middle" class="t">Tilt and load sensor</text><text x="650" y="88" text-anchor="middle" class="s">slave, node 30</text><line x1="650" y1="110" x2="650" y2="170" class="l"/></g>
<g><rect x="575" y="230" width="150" height="50" rx="8" class="b" stroke-dasharray="5 4"/><text x="650" y="253" text-anchor="middle" class="t">Work light</text><text x="650" y="270" text-anchor="middle" class="s">optional, node 40, absent</text><line x1="650" y1="170" x2="650" y2="230" class="l" stroke-dasharray="5 4"/></g>
<g><rect x="240" y="230" width="220" height="60" rx="8" class="r"/><text x="350" y="255" text-anchor="middle" class="t">Safety relay (simulated)</text><text x="350" y="273" text-anchor="middle" class="s">e-stops in series, cuts valve power</text>
<path d="M460 260 H505 V178 A8 8 0 0 0 505 162 V110" class="p"/><text x="512" y="215" class="s">valve power</text>
<text x="350" y="310" text-anchor="middle" class="s">The PLCs only read its status contact; it is not on the bus.</text></g>
</svg>
