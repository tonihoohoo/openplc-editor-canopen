name: CI - Unit Tests

on:
  workflow_dispatch:
  # Called from `ci.yml` on every pull request.
  workflow_call:
    inputs:
      docs_only:
        description: Skip the job; the pull request changes only Markdown or docs/.
        type: boolean
        default: false

jobs:
  # The suite runs in three shards; `Unit Tests + Coverage` merges their coverage and checks the
  # floors of jest.config.json (.github/scripts/coverage-merge.mjs).
  shard:
    name: Unit Tests shard ${{ matrix.shard }}/3
    if: ${{ !inputs.docs_only }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # --ignore-scripts skips the postinstall, so strucpp (a GitHub-release
      # package, not an npm dep) is never fetched — yet the TS sources import
      # `strucpp/libs/iec-types.json` and its runtime headers. Install just
      # strucpp (no native rebuild) so the suites
      # can load and the coverage gate actually runs.
      - name: Install strucpp
        run: npm run setup:strucpp

      - name: Run tests with coverage
        run: >-
          npx jest --config jest.config.json --collectCoverage --ci --shard=${{ matrix.shard }}/3
          --coverageReporters=json --coverageThreshold='{}' --coverageDirectory=coverage-shard

      - uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-${{ matrix.shard }}
          path: coverage-shard/coverage-final.json
          retention-days: 1

  unit-tests:
    name: Unit Tests + Coverage
    needs: shard
    # Runs when a shard fails too, so the required check reports the failure instead of skipping.
    if: ${{ !cancelled() && !inputs.docs_only }}
    runs-on: ubuntu-latest
    # Required check on `development` — a red suite blocks the merge.
    steps:
      - name: Shards
        if: ${{ needs.shard.result != 'success' }}
        run: |
          echo "::error::a unit test shard failed (${{ needs.shard.result }}); see the Unit Tests shard jobs"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          pattern: unit-coverage-*

      - name: Merge coverage and check the floors
        run: node .github/scripts/coverage-merge.mjs unit-coverage-*/coverage-final.json

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
