name: CANopen DBC cross-check

# Loads the DBC files the editor exports with two independent readers, cantools (strict) and
# canmatrix, within a load-time limit, and decodes with cantools the PDO, NMT, heartbeat and EMCY
# frames the editor expects, every SDO command byte in both directions, and the SDO transfers
# python-canopen makes between a client and a server on a virtual bus.
# Runs only when a pull request changes the DBC writer, the export code, their tests or these CI
# files (see .github/scripts/canopen-dbc-changed.sh); otherwise the job is skipped, which counts
# as passed.

on:
  pull_request:
    branches: [canopen]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canopen-dbc-crosscheck-${{ github.ref }}
  cancel-in-progress: true

env:
  CORPUS: ${{ github.workspace }}/dbc-crosscheck

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.files.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: DBC export files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/canopen-dbc-changed.sh

  crosscheck:
    name: CANopen DBC cross-check
    needs: changes
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Exported DBC files
        run: |
          npm ci --ignore-scripts
          npm run setup:strucpp
          CANOPEN_DBC_CROSSCHECK_OUT="$CORPUS" npx jest --config jest.config.json \
            src/middleware/shared/utils/canopen/__tests__/dbc-crosscheck-writer.test.ts
          test -f "$CORPUS/expected.json"

      - name: Load and decode
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q cantools==45.1.2 canmatrix==1.3.3 canopen==2.4.1 python-can==4.6.1
          "$RUNNER_TEMP/venv/bin/python" -I .github/scripts/canopen_dbc_crosscheck.py "$CORPUS" --max-load-seconds 60

      - name: Keep the corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canopen-dbc-crosscheck
          path: ${{ env.CORPUS }}
          if-no-files-found: ignore
