name: CI - Lint

on:
  workflow_call:
    inputs:
      docs_only:
        description: Skip the job; the pull request changes only Markdown or docs/.
        type: boolean
        default: false

jobs:
  lint:
    name: Lint Check
    if: ${{ !inputs.docs_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npx eslint "./src/**/*.{ts,tsx}"
